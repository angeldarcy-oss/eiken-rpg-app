<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>英検Quest</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- iOSはページ最初のHTMLのアイコン情報しか読まないため、
     Streamlit Cloud本体ではなくこの玄関ページをホーム画面に追加してもらう -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英検Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a1a2e">
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; }
  iframe { border: 0; width: 100%; height: 100%; position: fixed; inset: 0; }
  #fallback {
    display: none; color: #ccccee; font-family: sans-serif; text-align: center;
    padding: 40px 20px; line-height: 2;
  }
  #fallback a { color: #ffe066; font-size: 1.2rem; }
</style>
</head>
<body>
<iframe id="app" src="https://eiken-quest.streamlit.app/?embed=true"
        allow="autoplay; clipboard-write"></iframe>
<div id="fallback">
  ⚔️ 英検Quest<br>
  画面が表示されない場合はこちらをタップ：<br>
  <a href="https://eiken-quest.streamlit.app/">英検Questをひらく</a>
</div>
<script>
  // iframeが何らかの理由で表示できない環境向けの保険リンク
  setTimeout(function () {
    try {
      var f = document.getElementById('app');
      if (!f || !f.contentWindow) {
        document.getElementById('fallback').style.display = 'block';
      }
    } catch (e) {}
  }, 8000);
</script>
</body>
</html>
